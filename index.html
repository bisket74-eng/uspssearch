<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USPS Universal Search</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        postal: {
          blue: '#004B87',
          red: '#DA291C',
          darkblue: '#002B49',
          light: '#F4F6F9'
        }
      }
    }
  }
}
</script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #F4F6F9;
  color: #1e293b;
}

.search-input {
  width: 100%;
  min-width: 0;
  height: 48px;
  padding: 0 12px;
  font-size: 16px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  outline: none;
  background: white;
  -webkit-appearance: none;
}

.search-input:focus {
  border: 2px solid #004B87;
}

.search-button {
  height: 48px;
  padding: 0 18px;
  border: none;
  border-radius: 8px;
  background: #004B87;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
}

.search-button:active {
  background: #002B49;
}

.site-link {
  display: block;
  background: white;
  border: 1px solid #dbe1e8;
  border-radius: 8px;
  padding: 11px 12px;
  text-decoration: none;
  color: #1e293b;
}

.site-link:active {
  background: #e8f0f8;
}

.site-link strong {
  display: block;
  color: #004B87;
  font-size: 14px;
}

.site-link span {
  display: block;
  color: #64748b;
  font-size: 11px;
  margin-top: 3px;
}
</style>
</head>

<body>

<!-- Header -->
<header class="bg-postal-darkblue text-white border-b-4 border-postal-red">
  <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
    <h1 class="text-lg font-bold">🔎 Postal Resource Search</h1>
    <span class="text-xs text-slate-300">USPS Tools</span>
  </div>
</header>

<!-- Main -->
<main class="max-w-4xl mx-auto px-3 py-4">

  <!-- Search -->
  <section class="bg-white rounded-lg border border-slate-200 p-4 shadow-sm">

    <h2 class="text-lg font-bold text-postal-darkblue mb-3">
      Universal Manual & Site Search
    </h2>

    <form
      action="https://cse.google.com/cse/publicurl"
      method="get"
      target="_blank"
      class="flex gap-2"
    >

      <input
        class="search-input"
        type="search"
        name="q"
        placeholder="Search postal resources..."
        autocomplete="off"
        enterkeyhint="search"
        required
      >

      <input
        type="hidden"
        name="cx"
        value="71c15baa33d51d26"
      >

      <button class="search-button" type="submit">
        Search
      </button>

    </form>

  </section>

  <!-- Direct Links -->
  <section class="mt-4">

    <h2 class="text-base font-bold text-postal-darkblue mb-2">
      Direct Site Links
    </h2>

    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">

      <a class="site-link" href="https://pe.usps.com/" target="_blank">
        <strong>Postal Explorer</strong>
        <span>DMM • IMM • Manuals</span>
      </a>

      <a class="site-link" href="https://postalpro.usps.com/" target="_blank">
        <strong>PostalPro</strong>
        <span>Technical resources</span>
      </a>

      <a class="site-link" href="https://www.usps.com/" target="_blank">
        <strong>USPS.com</strong>
        <span>Tracking • Shipping</span>
      </a>

      <a class="site-link" href="https://www.apwu.org/" target="_blank">
        <strong>APWU</strong>
        <span>Union • Contracts</span>
      </a>

      <a class="site-link" href="https://www.nalc.org/" target="_blank">
        <strong>NALC</strong>
        <span>Letter carriers</span>
      </a>

    </div>

  </section>

</main>

<!-- Footer -->
<footer class="text-center text-xs text-slate-400 py-3">
  Postal Resource Search
</footer>

</body>
</html>
