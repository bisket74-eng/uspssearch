<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USPS Universal Search</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        postal: {
          blue: '#004B87',
          red: '#DA291C',
          darkblue: '#002B49',
          light: '#F4F6F9'
        }
      }
    }
  }
}
</script>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #F4F6F9;
  color: #1e293b;
}

/* Google search */
.gsc-control-cse {
  padding: 0 !important;
  border: 0 !important;
  background: transparent !important;
}

.gsc-search-box {
  margin-bottom: 8px !important;
}

.gsc-input-box {
  height: 44px !important;
  border-radius: 8px !important;
}

.gsc-input {
  height: 42px !important;
  font-size: 16px !important;
}

.gsc-search-button-v2 {
  height: 44px !important;
  padding: 0 16px !important;
  border-radius: 8px !important;
  background: #004B87 !important;
  border-color: #004B87 !important;
}

.gsc-search-button-v2:hover {
  background: #002B49 !important;
  border-color: #002B49 !important;
}

.gs-title {
  color: #004B87 !important;
}

.gs-snippet {
  font-size: 13px !important;
}

.site-link {
  display: block;
  background: white;
  border: 1px solid #dbe1e8;
  border-radius: 8px;
  padding: 9px 10px;
  text-decoration: none;
  color: #1e293b;
}

.site-link:active {
  background: #e8f0f8;
}

.site-link strong {
  display: block;
  color: #004B87;
  font-size: 13px;
}

.site-link span {
  display: block;
  color: #64748b;
  font-size: 10px;
  margin-top: 2px;
}
</style>
<!-- Google Programmable Search — standard async embed, no explicit render needed -->
<script>
  (function() {
    var cx = '71c15baa33d51d26';
    var gcse = document.createElement('script');
    gcse.type = 'text/javascript';
    gcse.async = true;
    gcse.src = 'https://cse.google.com/cse.js?cx=' + cx;
    var s = document.getElementsByTagName('script')[0];
    s.parentNode.insertBefore(gcse, s);
  })();
</script>
</head>
<body>
<header class="bg-postal-darkblue text-white border-b-4 border-postal-red">
  <div class="max-w-4xl mx-auto px-3 py-2 flex justify-between items-center">
    <h1 class="text-base font-bold">🔎 Postal Resource Search</h1>
    <span class="text-xs text-slate-300">USPS Tools</span>
  </div>
</header>

<main class="max-w-4xl mx-auto px-3 py-2">
  <section class="bg-white rounded-lg border border-slate-200 p-3 shadow-sm">
    <h2 class="text-base font-bold text-postal-darkblue mb-2">Universal Manual & Site Search</h2>
    <!-- Standard CSE tag embed -->
    <div class="gcse-search"></div>
  </section>

  <section class="mt-3">
    <h2 class="text-sm font-bold text-postal-darkblue mb-1">Direct Site Links</h2>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5">

      <a class="site-link" href="https://pe.usps.com/" target="_blank" rel="noopener">
        <strong>Postal Explorer</strong>
        <span>DMM • IMM • Manuals</span>
      </a>

      <a class="site-link" href="https://postalpro.usps.com/" target="_blank" rel="noopener">
        <strong>PostalPro</strong>
        <span>Technical resources</span>
      </a>

      <a class="site-link" href="https://www.usps.com/" target="_blank" rel="noopener">
        <strong>USPS.com</strong>
        <span>Tracking • Shipping</span>
      </a>

      <a class="site-link" href="https://www.apwu.org/" target="_blank" rel="noopener">
        <strong>APWU</strong>
        <span>Union • Contracts</span>
      </a>

      <a class="site-link" href="https://www.nalc.org/" target="_blank" rel="noopener">
        <strong>NALC</strong>
        <span>Letter carriers</span>
      </a>

    </div>
  </section>
</main>

<footer class="text-center text-xs text-slate-400 py-2">
  Postal Resource Search
</footer>
</body>
</html>
