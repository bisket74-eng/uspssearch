<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USPS Universal Search</title><script src="https://cdn.tailwindcss.com"></script><script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        postal: {
          blue: '#004B87',
          red: '#DA291C',
          darkblue: '#002B49',
          light: '#F4F6F9'
        }
      }
    }
  }
</script><style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #F4F6F9;
  color: #1e293b;
}

.search-row {
  display: flex;
  gap: 8px;
  width: 100%;
}

.search-input {
  flex: 1;
  min-width: 0;
  height: 44px;
  padding: 0 12px;
  font-size: 16px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  outline: none;
  background: white;
  -webkit-appearance: none;
}

.search-input:focus {
  border: 2px solid #004B87;
}

.search-button {
  flex: 0 0 auto;
  height: 44px;
  padding: 0 16px;
  border: none;
  border-radius: 8px;
  background: #004B87;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
}

.search-button:active {
  background: #002B49;
}

.site-link {
  display: block;
  background: white;
  border: 1px solid #dbe1e8;
  border-radius: 8px;
  padding: 9px 10px;
  text-decoration: none;
  color: #1e293b;
}

.site-link:active {
  background: #e8f0f8;
}

.site-link strong {
  display: block;
  color: #004B87;
  font-size: 13px;
}

.site-link span {
  display: block;
  color: #64748b;
  font-size: 10px;
  margin-top: 2px;
}

@media (max-width: 360px) {
  .search-button {
    padding: 0 12px;
  }
}
</style></head><body><header class="bg-postal-darkblue text-white border-b-4 border-postal-red">
  <div class="max-w-4xl mx-auto px-3 py-2 flex justify-between items-center">
    <h1 class="text-base font-bold">🔎 Postal Resource Search</h1>
    <span class="text-xs text-slate-300">USPS Tools</span>
  </div>
</header><main class="max-w-4xl mx-auto px-3 py-2">  <section class="bg-white rounded-lg border border-slate-200 p-3 shadow-sm"><h2 class="text-base font-bold text-postal-darkblue mb-2">
  Universal Manual & Site Search
</h2>

<form
  id="searchForm"
  class="search-row"
  action="https://www.google.com/search"
  method="get"
  target="_blank"
>

  <input
    class="search-input"
    type="search"
    id="searchInput"
    name="q"
    placeholder="Search postal resources..."
    autocomplete="off"
    enterkeyhint="search"
    required
  >

  <input
    type="hidden"
    name="cx"
    value="71c15baa33d51d26"
  >

  <button class="search-button" type="submit">
    Search
  </button>

</form>

  </section>  <section class="mt-3"><h2 class="text-sm font-bold text-postal-darkblue mb-1">
  Direct Site Links
</h2>

<div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5">

  <a class="site-link" href="https://pe.usps.com/" target="_blank" rel="noopener">
    <strong>Postal Explorer</strong>
    <span>DMM • IMM • Manuals</span>
  </a>

  <a class="site-link" href="https://postalpro.usps.com/" target="_blank" rel="noopener">
    <strong>PostalPro</strong>
    <span>Technical resources</span>
  </a>

  <a class="site-link" href="https://www.usps.com/" target="_blank" rel="noopener">
    <strong>USPS.com</strong>
    <span>Tracking • Shipping</span>
  </a>

  <a class="site-link" href="https://www.apwu.org/" target="_blank" rel="noopener">
    <strong>APWU</strong>
    <span>Union • Contracts</span>
  </a>

  <a class="site-link" href="https://www.nalc.org/" target="_blank" rel="noopener">
    <strong>NALC</strong>
    <span>Letter carriers</span>
  </a>

</div>

  </section></main><footer class="text-center text-xs text-slate-400 py-2">
  Postal Resource Search
</footer></body>
</html>
